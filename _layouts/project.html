---
layout: default
disqus: false
archive: false
---

{% include post-font.html %}

<main class="site-content-inner">
    <p class="section-label" style="margin-bottom: 1.7rem;">// project</p>

    <h1 style="margin-top: 0;">{{ page.title }}</h1>

    {% if page.timeframe %}<p class="project-timeframe">{{ page.timeframe }}</p>{% endif %}

    <figure>
        <img src="{{ page.picture-url | relative_url }}" class="project-detail-img" alt="{{ page.title }}">
    </figure>

    <div class="post-body">
        {{ content }}
    </div>
</main>
