<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ site.name }}{% if page.title %} — {{ page.title }}{% endif %}</title>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="description" content="{{ site.meta_description }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
    <link rel="manifest" href="/assets/images/site.webmanifest">
    <meta name="theme-color" content="#0c0c0e">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Highlight.js -->
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github-dark-dimmed.min.css">

    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg-primary: #0c0c0e;
            --bg-secondary: #111114;
            --bg-card: #151518;
            --bg-card-hover: #1a1a1e;
            --accent: #7ee2a8;
            --accent-soft: rgba(126, 226, 168, 0.12);
            --text-primary: #ececef;
            --text-secondary: #a1a1aa;
            --text-muted: #6b6b75;
            --border: #232328;
            --border-hover: #34343b;
            --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
            --max-width: 860px;
            --gutter: clamp(1rem, 4vw, 3rem);
            --radius: 10px;
        }

        /* ===== RESET & BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            scroll-behavior: smooth;
            scrollbar-gutter: stable;
            scrollbar-color: var(--border-hover) var(--bg-primary);
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.7;
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ===== LAYOUT WRAPPER ===== */
        .site-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== NAVIGATION ===== */
        .site-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            background: rgba(12, 12, 14, 0.8);
            backdrop-filter: saturate(180%) blur(12px);
            -webkit-backdrop-filter: saturate(180%) blur(12px);
        }

        .nav-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--gutter);
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .nav-logo {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-logo .prompt {
            color: var(--accent);
        }

        .nav-logo::after {
            content: '';
            width: 0.5em;
            height: 1.1em;
            background: var(--text-secondary);
            opacity: 0;
            margin-left: -0.15rem;
        }

        .nav-logo:hover { color: var(--text-primary); }

        .nav-logo:hover::after {
            animation: blink 1s steps(1) infinite;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 0.25rem;
            margin: 0;
        }

        .nav-links li { margin: 0; }

        .nav-links a {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            transition: color 0.15s ease, background-color 0.15s ease;
        }

        .nav-links a:hover {
            color: var(--text-primary);
            background: var(--bg-card-hover);
        }

        /* Mobile nav toggle */
        .nav-toggle {
            display: none;
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            padding: 0.35rem 0.5rem;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
        }

        @media (max-width: 600px) {
            .nav-toggle { display: block; }
            .nav-links {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                background: var(--bg-secondary);
                border-bottom: 1px solid var(--border);
                flex-direction: column;
                padding: 0.5rem;
            }
            .nav-links.open { display: flex; }
            .nav-links a { display: block; padding: 0.75rem 1rem; }
        }

        /* ===== MAIN CONTENT ===== */
        .site-content {
            flex: 1;
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 2rem var(--gutter) 5rem;
            width: 100%;
        }

        /* ===== TYPOGRAPHY ===== */
        h1, h2, h3, h4 {
            font-family: var(--font-sans);
            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        h1 {
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: clamp(1.3rem, 3vw, 1.55rem);
            margin-top: 2.75rem;
            margin-bottom: 1rem;
        }

        h3 {
            font-size: 1.15rem;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        p {
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        strong { color: var(--text-primary); font-weight: 600; }

        a {
            color: var(--text-primary);
            text-decoration: underline;
            text-decoration-color: var(--border-hover);
            text-underline-offset: 3px;
            transition: color 0.15s ease, text-decoration-color 0.15s ease;
        }

        a:hover {
            color: var(--accent);
            text-decoration-color: var(--accent);
        }

        code {
            font-family: var(--font-mono);
            font-size: 0.85em;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.1em 0.4em;
            border-radius: 5px;
        }

        pre {
            background: var(--bg-secondary) !important;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
        }

        pre code, pre code.hljs {
            background: none;
            border: none;
            padding: 0;
            font-size: 0.85rem;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
        }

        figure {
            margin: 0 0 1.5rem;
        }

        figure img {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        figcaption {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 2.5rem 0;
        }

        ul, ol {
            padding-left: 1.5rem;
            margin-bottom: 1.25rem;
            color: var(--text-secondary);
        }

        li {
            margin-bottom: 0.4rem;
        }

        li::marker { color: var(--text-muted); }

        blockquote {
            border-left: 2px solid var(--border-hover);
            padding-left: 1.25rem;
            color: var(--text-secondary);
            margin: 1.5rem 0;
        }

        /* ===== ROBOT PROJECT CARDS ===== */
        .project-grid {
            display: grid;
            gap: 1.25rem;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
        }

        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .project-card:hover {
            border-color: var(--border-hover);
            background: var(--bg-card-hover);
        }

        .project-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project-card .card-image {
            overflow: hidden;
            clip-path: inset(0);
            aspect-ratio: 16 / 10;
            border-bottom: 1px solid var(--border);
        }

        .project-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0;
            transform: scale(1.001);
            will-change: transform;
            transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .project-card:hover .card-image img {
            transform: scale(1.03);
        }

        .project-card .card-body {
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .project-card .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .project-card .card-body::after {
            content: '\2192';
            color: var(--text-muted);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .project-card:hover .card-body::after {
            color: var(--accent);
            transform: translateX(3px);
        }

        /* ===== BLOG LIST ===== */
        .blog-list {
            display: flex;
            flex-direction: column;
        }

        .blog-item {
            display: flex;
            align-items: baseline;
            gap: 1.5rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid var(--border);
        }

        .blog-item .blog-date {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            min-width: 100px;
        }

        .blog-item .blog-title {
            font-size: 1rem;
            font-weight: 500;
        }

        .blog-item .blog-title a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .blog-item:hover .blog-title a {
            color: var(--accent);
        }

        /* ===== SECTION HEADERS ===== */
        .section-label {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* ===== HOME HERO ===== */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.5rem;
            margin-top: 1rem;
            margin-bottom: 3rem;
        }

        .hero img {
            width: 120px;
            height: 120px;
            flex-shrink: 0;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        .hero h1 { margin-bottom: 0.4rem; }

        .hero .tagline {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 0;
        }

        .hero .tagline .sep { color: var(--border-hover); margin: 0 0.4rem; }

        @media (max-width: 600px) {
            .hero { gap: 1.25rem; }
            .hero img { width: 96px; height: 96px; }
        }

        /* ===== FOOTER ===== */
        .site-footer {
            border-top: 1px solid var(--border);
            padding: 2rem 0;
            margin-top: auto;
        }

        .footer-inner {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 var(--gutter);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .footer-copy {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer-links {
            display: flex;
            list-style: none;
            gap: 1.25rem;
            padding: 0;
            margin: 0;
        }

        .footer-links li { margin: 0; }

        .footer-links a {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-decoration: none;
        }

        .footer-links a:hover {
            color: var(--text-primary);
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .animate-in {
            animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        }

        .animate-in:nth-child(1) { animation-delay: 0.03s; }
        .animate-in:nth-child(2) { animation-delay: 0.06s; }
        .animate-in:nth-child(3) { animation-delay: 0.09s; }
        .animate-in:nth-child(4) { animation-delay: 0.12s; }
        .animate-in:nth-child(5) { animation-delay: 0.15s; }
        .animate-in:nth-child(6) { animation-delay: 0.18s; }
        .animate-in:nth-child(7) { animation-delay: 0.21s; }
        .animate-in:nth-child(8) { animation-delay: 0.24s; }

        @media (prefers-reduced-motion: reduce) {
            .animate-in { animation: none; }
            html { scroll-behavior: auto; }
        }

        /* ===== UTILITY ===== */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
        }

        /* ===== PROJECT DETAIL PAGE ===== */
        .project-detail-img {
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        /* ===== ABOUT PAGE ===== */
        .about-layout {
            display: grid;
            grid-template-columns: 160px 1fr;
            gap: 2.5rem;
            align-items: start;
        }

        .about-layout .about-photo img {
            width: 160px;
            height: 160px;
            object-fit: cover;
            border-radius: 50%;
            border: 1px solid var(--border);
        }

        @media (max-width: 600px) {
            .about-layout {
                grid-template-columns: 1fr;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-hover); }

        /* ===== SELECTION ===== */
        ::selection {
            background: var(--accent-soft);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="site-wrapper">
        <!-- Navigation -->
        <nav class="site-nav">
            <div class="nav-inner">
                <a href="{{ '/' | relative_url }}" class="nav-logo">
                    <span class="prompt">~$</span> oshadha
                </a>
                <button class="nav-toggle" aria-label="Menu" onclick="this.nextElementSibling.classList.toggle('open')">
                    &#9776;
                </button>
                <ul class="nav-links">
                    <li><a href="{{ '/' | relative_url }}">home</a></li>
                    <li><a href="{{ '/pages/robots' | relative_url }}">robots</a></li>
                    <!-- <li><a href="{{ '/pages/blog' | relative_url }}">blog</a></li> -->
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="site-content">
            {{ content }}
        </main>

        <!-- Footer -->
        <footer class="site-footer">
            <div class="footer-inner">
                <span class="footer-copy">&copy; {{ 'now' | date: '%Y' }} Oshadha Gunasekara</span>
                <ul class="footer-links">
                    <li><a href="https://github.com/ogunasekara" target="_blank" rel="noopener">GitHub</a></li>
                    <li><a href="https://www.linkedin.com/in/oshadhagunasekara/" target="_blank" rel="noopener">LinkedIn</a></li>
                    <li><a href="mailto:oshadha123@gmail.com">Email</a></li>
                </ul>
            </div>
        </footer>
    </div>

    <!-- Highlight.js -->
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script>hljs.highlightAll();</script>
</body>
</html>
